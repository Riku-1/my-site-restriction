<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Time Limit 設定</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    input { padding: .4rem .6rem; font-size: 1rem; }
    input[name="domain"] { flex: 1 1 220px; }
    input[name="minutes"] { width: 110px; }
    button { padding: .4rem .9rem; font-size: .95rem; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem .3rem; border-bottom: 1px solid #8884; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .empty { opacity: .6; padding: 1rem 0; }
    .error { color: #c00; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>サイトごとの1日の上限時間</h1>

  <form id="form">
    <input name="domain" placeholder="例: youtube.com" required>
    <input name="minutes" type="number" min="1" step="1" placeholder="上限（分）" required>
    <button type="submit">追加 / 更新</button>
  </form>
  <div id="error" class="error"></div>

  <table>
    <thead>
      <tr><th>サイト</th><th>上限</th><th>今日の利用</th><th></th></tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
  <div id="empty" class="empty" hidden>まだ制限しているサイトはありません。</div>

  <script src="options.js"></script>
</body>
</html>
